<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kivi — Semantic Memory</title>
    <meta
      name="description"
      content="Kivi remembers your work context from past dictations and helps you prepare."
    />

    <!-- Kivi's own typefaces: Petrona (serif) and Space Grotesk (sans) are the
         two the Kivi desktop app ships - its install directory carries the OFL
         licences for exactly these - plus Geist Mono for figures and metadata.
         Every stack has a real fallback, so the app still reads correctly with
         no network. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,300..700;1,300..700&family=Space+Grotesk:wght@300..700&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@100,200,300,400,500,600,700,800,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
